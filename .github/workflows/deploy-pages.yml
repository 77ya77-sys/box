# Сборка dist → ветка gh-pages (только статика, без папки docs на main).
# Потом API: Pages = legacy, ветка gh-pages, корень /.
# index.html в корне main — только для Vite dev; на сайте один index + 404.html (норма для SPA на GitHub).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Push dist → gh-pages (только артефакты сборки)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Включить Pages: legacy, ветка gh-pages, корень /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/pages"
          HDR=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/pg.json -w "%{http_code}" "${HDR[@]}" "$API")
          echo "GET $API => HTTP $code"
          if [ "$code" = "404" ]; then
            curl -sS -f -X POST "${HDR[@]}" "$API" -d "$BODY"
            echo "POST pages OK"
          else
            curl -sS -f -X PUT "${HDR[@]}" "$API" -d "$BODY"
            echo "PUT pages OK"
          fi
