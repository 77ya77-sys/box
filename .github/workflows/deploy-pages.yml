# Кладёт production-сборку в папку docs/ на main. GitHub Pages: Branch main, Folder /docs (не root).
# Пуши только в docs/ не перезапускают workflow (paths-ignore).

name: Sync site to docs

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Update docs/ from dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf docs
          cp -r dist docs
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ already matches dist"
            exit 0
          fi
          git commit -m "chore(pages): sync dist to docs [skip ci]"
          git push
