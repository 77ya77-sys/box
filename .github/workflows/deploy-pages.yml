# dist → ветка gh-pages (там уже лежит правильный index с /box/assets/…).
# Затем REST: источник Pages = legacy, ветка gh-pages, корень / (не main — там сырой Vite index).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Push dist → gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Pages: только ветка gh-pages (legacy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/pages"
          HDR=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/pg-get.json -w "%{http_code}" "${HDR[@]}" "$API")
          echo "GET $API => HTTP $code"
          if [ "$code" = "404" ]; then
            http=$(curl -sS -o /tmp/pg-out.json -w "%{http_code}" -X POST "${HDR[@]}" "$API" -d "$BODY")
            echo "POST => HTTP $http"; cat /tmp/pg-out.json
          else
            http=$(curl -sS -o /tmp/pg-out.json -w "%{http_code}" -X PUT "${HDR[@]}" "$API" -d "$BODY")
            echo "PUT => HTTP $http"; cat /tmp/pg-out.json
          fi
          case "$http" in
            20*|204) echo "Pages API OK" ;;
            *) exit 1 ;;
          esac
