# Публикация только из артефакта сборки (dist). Не используем корень main — там сырой index.html для Vite.
# Источник Pages: GitHub Actions (build_type: workflow), не ветка /docs и не «/» на main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub ожидает branch/path даже для workflow — см. REST Pages.
      - name: Переключить Pages на GitHub Actions (workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/pages"
          HDR=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          BODY='{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pg.json -w "%{http_code}" "${HDR[@]}" "$API")
          echo "GET $API => HTTP $code"
          if [ "$code" = "404" ]; then
            http=$(curl -sS -o /tmp/pg-out.json -w "%{http_code}" -X POST "${HDR[@]}" "$API" -d "$BODY")
            echo "POST => HTTP $http"; cat /tmp/pg-out.json
            [[ "$http" =~ ^20 ]]
          else
            http=$(curl -sS -o /tmp/pg-out.json -w "%{http_code}" -X PUT "${HDR[@]}" "$API" -d "$BODY")
            echo "PUT => HTTP $http"; cat /tmp/pg-out.json
            [[ "$http" =~ ^20 ]]
          fi
          rm -f /tmp/pg.json /tmp/pg-out.json

      - id: deployment
        uses: actions/deploy-pages@v4
