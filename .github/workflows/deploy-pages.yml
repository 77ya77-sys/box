# Сборка с base /<repo>/ → публикация из docs/ (Source: Deploy from branch, main/docs).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-docs-sync
  cancel-in-progress: true

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Сборка под GitHub Pages
        run: npm ci && npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Копировать dist в docs и пуш
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf docs
          mkdir -p docs
          cp -a dist/. docs/
          test -f docs/index.html
          : > docs/.nojekyll
          git add docs
          if git diff --staged --quiet; then
            echo "docs уже совпадает с dist, коммит не нужен"
            exit 0
          fi
          git commit -m "chore(pages): sync docs from dist [skip ci]"
          git push
