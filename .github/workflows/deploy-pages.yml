# 1) Через API включает GitHub Pages: legacy, ветка по умолчанию репо, папка /docs (без ручных Settings).
# 2) Собирает и кладёт dist → docs/, пушит [skip ci].
# Пуши только в docs/ не перезапускают workflow.

name: Sync site to docs

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Включить Pages: legacy + default branch + /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/${REPO}/pages"
          META="https://api.github.com/repos/${REPO}"
          HDR=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          BR=$(curl -sS "${HDR[@]}" "$META" | jq -r .default_branch)
          echo "default_branch=$BR"
          BODY=$(jq -nc --arg br "$BR" '{build_type:"legacy",source:{branch:$br,path:"/docs"}}')
          code=$(curl -sS -o /tmp/pg.json -w "%{http_code}" "${HDR[@]}" "$API")
          echo "GET $API => HTTP $code"
          if [ "$code" = "404" ]; then
            curl -sS -f -X POST "${HDR[@]}" "$API" -d "$BODY" | tee /tmp/out.json
            echo "POST pages (create) OK"
          else
            curl -sS -f -X PUT "${HDR[@]}" "$API" -d "$BODY" | tee /tmp/out.json
            echo "PUT pages (update) OK"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Update docs/ from dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf docs
          cp -r dist docs
          git add docs
          if git diff --staged --quiet; then
            echo "docs/ already matches dist"
            exit 0
          fi
          git commit -m "chore(pages): sync dist to docs [skip ci]"
          git push
