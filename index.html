<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const isGitHubPages = location.hostname.endsWith('github.io')
        const inDocs = /\/docs(\/|$)/.test(location.pathname)
        if (isGitHubPages && !inDocs) {
          location.replace(new URL('docs/', location.href).href)
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Курьер-бокс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
